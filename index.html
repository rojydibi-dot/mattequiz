<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lolyas Mattestudio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#FBF8F1; --card:#FFFFFF; --card2:#F5F1E7;
  --ink:#20304F; --muted:#6A7488; --line:#E7E1D2;
  --teal:#0E9C93; --teal-d:#0B7E77;
  --coral:#FF7A59; --coral-d:#E85F3C;
  --violet:#7B61FF;
  --good:#1CA36B; --good-bg:#E3F6EC;
  --bad:#E24A3B; --bad-bg:#FDECE9;
  --gold:#F0B429;
  --shadow:0 10px 30px rgba(32,48,79,.10);
  --grid:rgba(32,48,79,.045);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12141B; --card:#1B1F2A; --card2:#232837;
    --ink:#EBEEF5; --muted:#9AA3B6; --line:#2C3242;
    --teal:#2AC0B5; --teal-d:#1B9B92;
    --coral:#FF8C6E; --coral-d:#FF7A59;
    --violet:#9B85FF;
    --good:#39C486; --good-bg:#12312A;
    --bad:#F0685A; --bad-bg:#3A1E1D;
    --gold:#F5C651;
    --shadow:0 12px 34px rgba(0,0,0,.42);
    --grid:rgba(255,255,255,.035);
  }
}
:root[data-theme="light"]{
  --paper:#FBF8F1; --card:#FFFFFF; --card2:#F5F1E7; --ink:#20304F; --muted:#6A7488;
  --line:#E7E1D2; --teal:#0E9C93; --coral:#FF7A59; --good:#1CA36B; --good-bg:#E3F6EC;
  --bad:#E24A3B; --bad-bg:#FDECE9; --shadow:0 10px 30px rgba(32,48,79,.10); --grid:rgba(32,48,79,.045);
}
:root[data-theme="dark"]{
  --paper:#12141B; --card:#1B1F2A; --card2:#232837; --ink:#EBEEF5; --muted:#9AA3B6;
  --line:#2C3242; --teal:#2AC0B5; --coral:#FF8C6E; --good:#39C486; --good-bg:#12312A;
  --bad:#F0685A; --bad-bg:#3A1E1D; --shadow:0 12px 34px rgba(0,0,0,.42); --grid:rgba(255,255,255,.035);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Segoe UI Variable","Segoe UI",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  background-image:radial-gradient(1000px 520px at 50% -8%, rgba(255,122,89,.08), transparent 68%),radial-gradient(760px 420px at 100% 8%, rgba(14,156,147,.06), transparent 70%);
  background-attachment:fixed;background-repeat:no-repeat;
  line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;display:flex;flex-direction:column}

/* Header */
header{display:flex;align-items:center;gap:14px;padding:6px 4px 14px}
.mascot{
  width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;
  background:linear-gradient(150deg,var(--teal),var(--teal-d));box-shadow:var(--shadow);
}
.brand h1{font-size:1.28rem;margin:0;letter-spacing:-.02em;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:.82rem;font-weight:600}
.scorepill{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;
  font-size:.8rem;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow)
}
.chip b{color:var(--teal)}
.themebtn{cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:999px;width:38px;height:38px;font-size:1rem}

/* Chat */
#chat{display:flex;flex-direction:column;gap:14px;padding:8px 2px 18px;flex:1}
.msg{display:flex;gap:10px;align-items:flex-end;animation:pop .32s cubic-bezier(.2,.8,.3,1.1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.avatar{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--card2);border:1.5px solid var(--line)}
.bubble{
  background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;
  padding:12px 15px;max-width:82%;box-shadow:var(--shadow);font-size:.98rem
}
.bubble p{margin:0 0 8px}.bubble p:last-child{margin:0}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{
  background:linear-gradient(150deg,var(--coral),var(--coral-d));color:#fff;border:none;
  border-radius:18px 18px 6px 18px;font-weight:700
}
.msg.me .avatar{background:linear-gradient(150deg,var(--coral),var(--coral-d));color:#fff;border:none}
.bubble.good{border-color:var(--good);background:var(--good-bg)}
.bubble.bad{border-color:var(--bad);background:var(--bad-bg)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 8px;border-radius:999px;margin-bottom:6px}
.tag.g{background:var(--good);color:#fff}.tag.b{background:var(--bad);color:#fff}
.steps{background:var(--card);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.9rem}
.steps .k{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.02em}

/* Panel (controls) */
#panel{position:sticky;bottom:0;padding-top:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:10px}
.level{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.level.latt{background:var(--good-bg);color:var(--good)}
.level.medel{background:#FFF3DA;color:#B5820E}
.level.svar{background:var(--bad-bg);color:var(--bad)}
@media (prefers-color-scheme:dark){.level.medel{background:#3a300f}}
.progress{height:7px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--coral));transition:width .4s}
.qtext{font-size:1.12rem;font-weight:700;margin:2px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt,.btn{cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card2);color:var(--ink);padding:13px 15px;text-align:left;transition:.15s;display:flex;gap:10px;align-items:center}
.opt:hover,.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.opt .lt{width:26px;height:26px;flex:none;border-radius:8px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-size:.82rem;color:var(--muted)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inrow{display:flex;gap:10px}
.inrow input{flex:1;font-family:inherit;font-size:1.15rem;font-weight:800;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);min-width:0}
.inrow input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,156,147,.18)}
.btn.primary{background:linear-gradient(150deg,var(--teal),var(--teal-d));color:#fff;border:none;justify-content:center}
.btn.coral{background:linear-gradient(150deg,var(--coral),var(--coral-d));color:#fff;border:none;justify-content:center}
.btn.ghost{background:var(--card);justify-content:center}
.btn.block{width:100%;justify-content:center;font-size:1.05rem;padding:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.actions .btn{flex:1}

/* Menu / topics */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;cursor:pointer;font-family:inherit;font-weight:800;font-size:.95rem;padding:11px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--muted)}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{cursor:pointer;text-align:left;font-family:inherit;border:1.5px solid var(--line);background:var(--card2);border-radius:16px;padding:14px;transition:.15s;display:flex;gap:12px;align-items:center}
.topic:hover{border-color:var(--coral);transform:translateY(-2px);box-shadow:var(--shadow)}
.topic .ic{font-size:1.7rem;flex:none}
.topic .tt{font-weight:800;font-size:.98rem;line-height:1.2}
.topic .ts{font-size:.75rem;color:var(--muted);font-weight:600}
@media(max-width:520px){.topics{grid-template-columns:1fr}.qtext{font-size:1.05rem}}

/* Theory card in chat */
.theory{max-width:100%!important}
.theory h3{margin:0 0 6px;font-size:1.15rem}
.theory h4{margin:14px 0 4px;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);display:flex;gap:7px;align-items:center}
.theory ul{margin:4px 0;padding-left:20px}.theory li{margin:3px 0}
.ex{background:var(--card2);border-left:3px solid var(--coral);border-radius:0 10px 10px 0;padding:9px 12px;margin:6px 0;font-size:.92rem}
.summary{background:var(--good-bg);border-radius:12px;padding:10px 14px;margin-top:10px}
.summary li{margin:4px 0;font-weight:600}
.mini{font-size:.78rem;color:var(--muted);margin-top:6px}
.hidden{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.grade{font-size:2.6rem;font-weight:900;letter-spacing:-.03em}
.gradebox{text-align:center;padding:8px 0}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:12px 0;border:1.5px solid var(--line)}
.bar i{display:block;height:100%}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-family:inherit;font-weight:700;font-size:.85em}
.footnote{text-align:center;color:var(--muted);font-size:.75rem;padding-top:20px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="mascot">🦉</div>
    <div class="brand">
      <h1>Lolyas Mattestudio</h1>
      <p>Fröken Uggla · åk 6 &amp; 7 · Lgr22</p>
    </div>
    <div class="scorepill">
      <div class="chip">⭐ <b id="score">0</b>/<span id="total">0</span></div>
      <button class="themebtn" id="themebtn" title="Byt tema">🌙</button>
    </div>
  </header>

  <div id="chat"></div>
  <div id="panel"></div>

  <div class="footnote">Byggd åt Lolya · innehåll enligt matteboken.se &amp; Lgr22</div>
</div>

<canvas class="confetti hidden" id="cfx"></canvas>

<script>

const NAME="Lolya";

/* ---------- DATA: topics with theory + questions ---------- */
// q types: mc(opts,correct index) · tf(correct bool) · in(ans + accept[])

const TOPICS=[
/* ============ ÅK 6 ============ */
{id:"brak",grade:6,ic:"🍕",name:"Bråk & decimaltal",sub:"Delar av det hela",
 theory:{
  intro:"Ett <b>bråk</b> visar en del av något helt. Talet <b>ovanför</b> strecket kallas <b>täljaren</b> (hur många delar vi har). Talet <b>under</b> kallas <b>nämnaren</b> (hur många lika delar det hela är delat i).",
  ex:["<b>3/4</b> betyder: det hela är delat i 4 lika delar, och vi tar 3 av dem.",

      "<b>Förläng</b> 1/3 till nämnare 12 → gånga med 4 → <b>4/12</b>.",

        "Att glömma <b>gemensam nämnare</b> innan man plussar bråk med olika nämnare.",

 q:{latt:[
  {t:"mc",q:"Vad kallas talet <b>ovanför</b> bråkstrecket?",opts:["Nämnaren","Täljaren","Decimalen","Resten"],correct:1,ex:"Talet ovanför strecket är <b>täljaren</b> – den visar hur många delar vi tar."},

  {t:"in",q:"Förkorta 2/4 så långt som möjligt.",ans:"1/2",accept:A("1/2","0,5","0.5"),ex:"Dela täljare och nämnare med 2 → <b>1/2</b>."},

  {t:"in",q:"Räkna ut: 6/8 − 2/8 = ? (svara som bråk)",ans:"4/8",accept:A("4/8","1/2","0,5","0.5"),ex:"Samma nämnare → 6−2=4 → <b>4/8</b> (som är samma som 1/2)."}

  {t:"in",q:"Multiplicera: 2/5 · 3/4 = ? (svara i enklaste form)",ans:"3/10",accept:A("3/10","6/20"),ex:"Gånga rakt: 2·3=6 och 5·4=20 → 6/20. Förkorta med 2 → <b>3/10</b>."},

  {t:"in",q:"Ett recept behöver 3/4 liter mjölk. Du gör dubbel sats. Hur många liter mjölk? (decimal)",ans:"1,5",accept:A("1,5","1.5","3/2"),ex:"Dubbelt av 3/4 = 6/4 = <b>1,5</b> liter."},

 ]}},

{id:"geometri",grade:6,ic:"📐",name:"Omkrets & Area",sub:"Runt om och yta",
 theory:{
  intro:"<b>Omkrets</b> är sträckan runt en figur – lägg ihop alla sidor. Mäts i cm, m … <b>Area</b> är ytan inuti – hur mycket plats figuren täcker. Mäts i <b>kvadratenheter</b> (cm², m²).",
  ex:["Rektangel: <b>Area = längd · bredd</b>. En rektangel 4 × 3 cm → 12 cm².",
      "Kvadrat: alla sidor lika. Sida 5 → omkrets 5·4 = 20 cm, area 5·5 = 25 cm².",
      "Triangel: <b>Area = (bas · höjd) ÷ 2</b>. Bas 8, höjd 5 → (8·5)/2 = 20 cm²."],
  miss:["Blanda ihop omkrets och area. Omkrets = runt om, area = insidan.",
        "Glömma <b>÷ 2</b> i triangelns area.",
        "Skriva fel enhet: area ska ha <b>²</b> (cm²)."],
  tips:["📏 Omkrets = ett snöre runt figuren. Area = hur många rutor får plats inuti.",
        "Kvadrat med area A → sidan är √A. Area 36 → sida 6."],
  sum:["Omkrets = summan av alla sidor (längdenhet).","Area rektangel = längd · bredd.","Area triangel = bas · höjd ÷ 2. Enhet: kvadratenhet."]},
 q:{latt:[
  {t:"in",q:"En kvadrat har sidan 5 cm. Vad är omkretsen i cm?",ans:"20",ex:"4 lika sidor: 5 × 4 = <b>20 cm</b>."},
  {t:"mc",q:"Vilken formel ger arean av en rektangel?",opts:["sida + sida","längd · bredd","(bas · höjd)/2","4 · sida"],correct:1,ex:"Area rektangel = <b>längd · bredd</b>."},
  {t:"in",q:"En rektangel är 4 cm × 3 cm. Vad är arean i cm²?",ans:"12",ex:"4 · 3 = <b>12 cm²</b>."},
  {t:"tf",q:"Omkrets mäts i cm och area i cm².",correct:true,ex:"Ja – area har alltid kvadratenhet. ✔"},
  {t:"in",q:"En rektangel är 6 cm och 2 cm. Omkrets i cm?",ans:"16",ex:"6 + 2 + 6 + 2 = <b>16 cm</b>."},
  {t:"in",q:"En kvadrat har sidan 4 cm. Area i cm²?",ans:"16",ex:"4 · 4 = <b>16 cm²</b>."},
  {t:"mc",q:"Vilken enhet passar för area?",opts:["cm","cm²","kg","liter"],correct:1,ex:"Area anges i kvadratenheter, t.ex. <b>cm²</b>."},
  {t:"in",q:"En triangel har sidorna 3, 4 och 5 cm. Omkrets i cm?",ans:"12",ex:"3 + 4 + 5 = <b>12 cm</b>."},
  {t:"tf",q:"Alla sidor i en kvadrat är lika långa.",correct:true,ex:"Det är definitionen av en kvadrat. ✔"},
  {t:"in",q:"En liksidig triangel har sidan 6 cm. Omkrets i cm?",ans:"18",ex:"3 lika sidor: 6 × 3 = <b>18 cm</b>."}
 ],medel:[
  {t:"in",q:"En triangel har bas 8 cm och höjd 5 cm. Area i cm²?",ans:"20",ex:"(8 · 5) ÷ 2 = 40 ÷ 2 = <b>20 cm²</b>."},
  {t:"in",q:"En rektangel är 12 cm × 7 cm. Area i cm²?",ans:"84",ex:"12 · 7 = <b>84 cm²</b>."},
  {t:"in",q:"En kvadrat har arean 36 cm². Vad är omkretsen i cm?",ans:"24",ex:"Sidan = √36 = 6. Omkrets = 6 · 4 = <b>24 cm</b>."},
  {t:"in",q:"En rektangel har area 24 cm² och bredd 4 cm. Vad är längden i cm?",ans:"6",ex:"Längd = area ÷ bredd = 24 ÷ 4 = <b>6 cm</b>."},
  {t:"in",q:"En triangel har bas 10 cm och höjd 6 cm. Area i cm²?",ans:"30",ex:"(10 · 6) ÷ 2 = <b>30 cm²</b>."},
  {t:"mc",q:"Vilken formel ger arean av en triangel?",opts:["bas · höjd","(bas · höjd)/2","bas + höjd","4 · bas"],correct:1,ex:"Triangelns area = <b>(bas · höjd) ÷ 2</b>."},
  {t:"in",q:"En rektangel är 15 cm × 10 cm. Omkrets i cm?",ans:"50",ex:"2 · (15 + 10) = 2 · 25 = <b>50 cm</b>."},
  {t:"in",q:"En kvadrat har omkretsen 28 cm. Hur lång är en sida i cm?",ans:"7",ex:"Sida = 28 ÷ 4 = <b>7 cm</b>."},
  {t:"in",q:"En kvadrat har sidan 9 cm. Area i cm²?",ans:"81",ex:"9 · 9 = <b>81 cm²</b>."},
  {t:"tf",q:"En triangel med bas 6 cm och höjd 4 cm har arean 12 cm².",correct:true,ex:"(6 · 4)/2 = 24/2 = <b>12 cm²</b>. ✔"}
 ],svar:[
  {t:"in",q:"En kvadrat har omkretsen 40 cm. Vad är arean i cm²?",ans:"100",ex:"Sidan = 40 ÷ 4 = 10. Area = 10 · 10 = <b>100 cm²</b>."},
  {t:"in",q:"Ett rum är 5 m × 4 m. Hur många m² matta behövs?",ans:"20",ex:"Area = 5 · 4 = <b>20 m²</b>."},
  {t:"in",q:"En figur består av en rektangel 6×4 cm och en rektangel 2×3 cm ihop. Total area i cm²?",ans:"30",ex:"6·4 = 24 och 2·3 = 6. Summa = 24 + 6 = <b>30 cm²</b>."},
  {t:"in",q:"En triangel har area 30 cm² och bas 10 cm. Vad är höjden i cm?",ans:"6",ex:"Area = bas·höjd/2 → 30 = 10·höjd/2 → höjd = 60 ÷ 10 = <b>6 cm</b>."},
  {t:"in",q:"En trädgård är 20 m × 15 m och ska ha staket runt om. Hur många meter staket?",ans:"70",ex:"Omkrets = 2 · (20 + 15) = 2 · 35 = <b>70 m</b>."},
  {t:"in",q:"En rektangel har längd 8 cm och area 56 cm². Vad är omkretsen i cm?",ans:"30",ex:"Bredd = 56 ÷ 8 = 7. Omkrets = 2 · (8 + 7) = <b>30 cm</b>."},
  {t:"in",q:"En vägg är 3 m × 2,5 m. En burk färg räcker till 5 m². Hur många burkar behövs?",ans:"2",ex:"Area = 3 · 2,5 = 7,5 m². 7,5 ÷ 5 = 1,5 → man måste köpa <b>2 burkar</b>."},
  {t:"in",q:"En kvadrat har arean 49 cm². Vad är omkretsen i cm?",ans:"28",ex:"Sidan = √49 = 7. Omkrets = 7 · 4 = <b>28 cm</b>."},
  {t:"in",q:"En triangel har bas 12 cm och höjd 9 cm. Area i cm²?",ans:"54",ex:"(12 · 9) ÷ 2 = 108 ÷ 2 = <b>54 cm²</b>."},
  {t:"in",q:"En rektangel är 2,5 m × 4 m. Area i m²?",ans:"10",ex:"2,5 · 4 = <b>10 m²</b>."}
 ]}},

{id:"raknesatt",grade:6,ic:"➗",name:"De fyra räknesätten",sub:"+ − · ÷",
 theory:{
  intro:"De fyra räknesätten är <b>addition (+)</b>, <b>subtraktion (−)</b>, <b>multiplikation (·)</b> och <b>division (÷)</b>. Multiplikation är upprepad addition, division är att dela upp i lika delar.",
  ex:["Prioritering: räkna först det som står inom <b>parentes</b>, sedan · och ÷, sist + och −.",
      "Exempel: (12 + 8) · 5 = 20 · 5 = <b>100</b>.",
      "Överslag: 199 + 402 ≈ 200 + 400 = <b>600</b> (ungefär)."],
  miss:["Räkna vänster-till-höger utan att tänka på prioritering.",
        "Glömma parentesen: 12 + 8 · 5 = 12 + 40 = 52, <i>inte</i> 100.",
        "Blanda ihop rest och kvot i division."],
  tips:["📎 Minnesregel: <b>P</b>arentes · <b>M</b>ultiplikation/Division · <b>A</b>ddition/Subtraktion.",
        "Kontrollera division med multiplikation: 72 ÷ 9 = 8 eftersom 8 · 9 = 72."],
  sum:["Fyra räknesätt: + − · ÷.","Parentes först, sedan · och ÷, sist + och −.","Överslag ger ett ungefärligt svar snabbt."]},
 q:{latt:[

  {t:"in",q:"Räkna ut: 92 − 47",ans:"45",ex:"92 − 47 = <b>45</b>."},
  {t:"in",q:"Räkna ut: 8 · 7",ans:"56",ex:"8 · 7 = <b>56</b>."},
  {t:"in",q:"Räkna ut: 72 ÷ 9",ans:"8",ex:"72 ÷ 9 = <b>8</b> (eftersom 8 · 9 = 72)."},
  {t:"in",q:"Räkna ut: 6 · 9",ans:"54",ex:"6 · 9 = <b>54</b>."},
  {t:"in",q:"Räkna ut: 100 − 64",ans:"36",ex:"100 − 64 = <b>36</b>."},
  {t:"in",q:"Räkna ut: 125 + 75",ans:"200",ex:"125 + 75 = <b>200</b>."},
  {t:"in",q:"Räkna ut: 12 · 5",ans:"60",ex:"12 · 5 = <b>60</b>."},
  {t:"in",q:"Räkna ut: 84 ÷ 7",ans:"12",ex:"84 ÷ 7 = <b>12</b>."},

 ],medel:[

{id:"negativa",grade:6,ic:"🌡️",name:"Negativa tal",sub:"Tal under noll",
 theory:{
  intro:"<b>Negativa tal</b> är tal som är mindre än 0, t.ex. −1, −2, −3. Vi ser dem ofta som <b>temperatur</b> (kallt) eller djup under havet. På en <b>tallinje</b> ligger negativa tal till vänster om 0 och positiva till höger.",
  ex:["−5 &lt; −2 &lt; 0 &lt; 3. Ju längre till vänster, desto mindre.","Temperatur 2° som sjunker 5° → 2 − 5 = <b>−3°</b>.","Motsatsen (lika långt från 0) till 6 är <b>−6</b>."],
  miss:["Tro att −10 är större än −2 (fel – −2 är större).","Glömma att räkna åt rätt håll på tallinjen.","Blanda ihop minustecknet för räknesätt och för negativa tal."],
  tips:["🌡️ Tänk termometer: uppåt = större, nedåt = mindre.","Skillnaden mellan två temperaturer = hoppa längs tallinjen och räkna stegen."],
  sum:["Negativa tal är mindre än 0.","På tallinjen: vänster = mindre, höger = större.","−2 är större än −10."]},
 q:{latt:[

  {t:"mc",q:"Vilket tal är minst?",opts:["−3","0","2","−1"],correct:0,ex:"<b>−3</b> ligger längst till vänster på tallinjen."},

  {t:"mc",q:"Vilket tal är störst?",opts:["−7","−2","−5","−9"],correct:1,ex:"<b>−2</b> är närmast 0 → störst av de negativa."},
  {t:"tf",q:"−1 är större än −10.",correct:true,ex:"−1 ligger till höger om −10 → större. ✔"},
  {t:"in",q:"Vad är −4 + 4?",ans:"0",ex:"−4 + 4 = <b>0</b>."},
  {t:"in",q:"Vilket tal är motsatsen till 6 (lika långt från 0)?",ans:"-6",accept:A("-6","−6"),ex:"Motsatsen till 6 är <b>−6</b>."},
  {t:"mc",q:"Vilket tal ligger längst till vänster på tallinjen?",opts:["−5","−2","1","3"],correct:0,ex:"<b>−5</b> är minst → längst till vänster."},
  {t:"in",q:"Vad är −2 + 5?",ans:"3",ex:"Från −2, gå 5 steg åt höger → <b>3</b>."}

{id:"avrundning",grade:6,ic:"🔎",name:"Avrundning & överslag",sub:"Ungefär och avrunda",

{id:"ekvationer",grade:7,ic:"⚖️",name:"Ekvationer",sub:"Hitta det okända x",
 theory:{
  intro:"En <b>ekvation</b> är två uttryck med ett likhetstecken emellan, t.ex. <span class='eq'>x + 3 = 8</span>. Att <b>lösa</b> ekvationen är att ta reda på vilket värde <b>x</b> har. Tänk på likhetstecknet som en <b>balansvåg</b> – gör du något på ena sidan måste du göra samma på andra.",
  ex:["<span class='eq'>x + 5 = 12</span> → dra bort 5 på båda sidor → <span class='eq'>x = 7</span>.",
      "<span class='eq'>2x = 14</span> → dela båda sidor med 2 → <span class='eq'>x = 7</span>.",
      "<span class='eq'>2x + 3 = 11</span> → −3 → 2x = 8 → ÷2 → <b>x = 4</b>."],
  miss:["Bara flytta talet till andra sidan utan att byta tecken.",
        "Glömma göra <b>samma sak på båda sidor</b>.",
        "Dela bara ena sidan med koefficienten."],
  tips:["⚖️ Håll vågen i balans: samma operation på båda sidor.",
        "Kontrollera: sätt in ditt x i ekvationen och se att det stämmer."],
  sum:["Ekvation = uttryck = uttryck.","Lös genom att göra samma sak på båda sidor.","Kontrollera alltid genom att sätta in svaret."]},
 q:{latt:[
  {t:"in",q:"Lös ekvationen: x + 5 = 12. x = ?",ans:"7",ex:"Dra bort 5 på båda sidor: x = 12 − 5 = <b>7</b>."},
  {t:"in",q:"Lös: x − 3 = 10. x = ?",ans:"13",ex:"Lägg till 3 på båda sidor: x = 10 + 3 = <b>13</b>."},
  {t:"in",q:"Lös: 2x = 14. x = ?",ans:"7",ex:"Dela båda sidor med 2: x = 14 ÷ 2 = <b>7</b>."},
  {t:"in",q:"Lös: x/2 = 6. x = ?",ans:"12",ex:"Gånga båda sidor med 2: x = 6 · 2 = <b>12</b>."},
  {t:"tf",q:"I ekvationen x + 2 = 5 är x = 3.",correct:true,ex:"3 + 2 = 5 stämmer. ✔"},
  {t:"in",q:"Lös: x + 8 = 20. x = ?",ans:"12",ex:"x = 20 − 8 = <b>12</b>."},
  {t:"in",q:"Lös: 3x = 21. x = ?",ans:"7",ex:"x = 21 ÷ 3 = <b>7</b>."},
  {t:"mc",q:"Vad betyder det att 'lösa en ekvation'?",opts:["Rita en graf","Hitta värdet på x","Gånga alla tal","Skriva om till bråk"],correct:1,ex:"Att lösa = hitta vilket värde <b>x</b> har."},
  {t:"in",q:"Lös: x − 7 = 0. x = ?",ans:"7",ex:"x = 0 + 7 = <b>7</b>."},
  {t:"in",q:"Lös: 5x = 5. x = ?",ans:"1",ex:"x = 5 ÷ 5 = <b>1</b>."}
 ],medel:[
  {t:"in",q:"Lös: 2x + 3 = 11. x = ?",ans:"4",ex:"−3: 2x = 8. ÷2: x = <b>4</b>."},
  {t:"in",q:"Lös: 3x − 4 = 11. x = ?",ans:"5",ex:"+4: 3x = 15. ÷3: x = <b>5</b>."},
  {t:"in",q:"Lös: 4x + 2 = 18. x = ?",ans:"4",ex:"−2: 4x = 16. ÷4: x = <b>4</b>."},
  {t:"in",q:"Lös: x/3 + 1 = 4. x = ?",ans:"9",ex:"−1: x/3 = 3. ·3: x = <b>9</b>."},
  {t:"in",q:"Lös: 2x + 5 = 5. x = ?",ans:"0",ex:"−5: 2x = 0. ÷2: x = <b>0</b>."},
  {t:"in",q:"Lös: 5x − 10 = 15. x = ?",ans:"5",ex:"+10: 5x = 25. ÷5: x = <b>5</b>."},
  {t:"in",q:"Lös: 10 − x = 3. x = ?",ans:"7",ex:"Flytta: 10 − 3 = x → x = <b>7</b>."},
  {t:"in",q:"Lös: 6x = 42. x = ?",ans:"7",ex:"x = 42 ÷ 6 = <b>7</b>."},
  {t:"in",q:"Lös: 2(x + 3) = 14. x = ?",ans:"4",ex:"÷2: x + 3 = 7. −3: x = <b>4</b>."},
  {t:"in",q:"Lös: 3x + x = 20. x = ?",ans:"5",ex:"3x + x = 4x = 20. ÷4: x = <b>5</b>."}
 ],svar:[
  {t:"in",q:"Lös: 4x + 3 = 2x + 11. x = ?",ans:"4",ex:"−2x: 2x + 3 = 11. −3: 2x = 8. ÷2: x = <b>4</b>."},
  {t:"in",q:"Lös: 5x − 2 = 3x + 8. x = ?",ans:"5",ex:"−3x: 2x − 2 = 8. +2: 2x = 10. ÷2: x = <b>5</b>."},
  {t:"in",q:"Lös: 2(x + 4) = 3x. x = ?",ans:"8",ex:"2x + 8 = 3x. −2x: 8 = x → x = <b>8</b>."},

  {t:"in",q:"Lös: 3(x − 2) = x + 4. x = ?",ans:"5",ex:"3x − 6 = x + 4. −x: 2x − 6 = 4. +6: 2x = 10. x = <b>5</b>."},
  {t:"in",q:"Lös: 7x − 5 = 4x + 7. x = ?",ans:"4",ex:"−4x: 3x − 5 = 7. +5: 3x = 12. ÷3: x = <b>4</b>."},
  {t:"in",q:"Två tal. Det ena är 5 större än det andra och summan är 23. Vilket är det <b>mindre</b> talet?",ans:"9",ex:"x + (x + 5) = 23 → 2x + 5 = 23 → 2x = 18 → x = <b>9</b>."},
  {t:"in",q:"Lös: 4(x − 1) = 2(x + 3). x = ?",ans:"5",ex:"4x − 4 = 2x + 6. −2x: 2x − 4 = 6. +4: 2x = 10. x = <b>5</b>."},
  {t:"in",q:"Lös: 5x + 2 = 3x + 14. x = ?",ans:"6",ex:"−3x: 2x + 2 = 14. −2: 2x = 12. ÷2: x = <b>6</b>."},
  {t:"in",q:"Lös: 8 + 2x = 20 − x. x = ?",ans:"4",ex:"+x: 8 + 3x = 20. −8: 3x = 12. ÷3: x = <b>4</b>."}
 ]}},

{id:"statistik",grade:7,ic:"📊",name:"Statistik",sub:"Medelvärde & median",
 theory:{
  intro:"<b>Statistik</b> hjälper oss förstå data. <b>Medelvärde</b> = summan av alla värden delat med antalet värden. <b>Median</b> = det mittersta värdet när talen står i storleksordning. <b>Typvärde</b> = det som förekommer flest gånger.",
  ex:["Medelvärde av 4, 6, 8: (4+6+8)/3 = 18/3 = <b>6</b>.",
      "Median av 3, 5, 9: mitten = <b>5</b>. Vid jämnt antal → medelvärdet av de två mittersta.",
      "Typvärde av 2, 3, 3, 7: <b>3</b> (kommer oftast)."],
  miss:["Glömma sortera talen innan man tar median.","Dela med fel antal vid medelvärde.",
        "Blanda ihop median och medelvärde."],
  tips:["📊 Median: sortera först, ta mitten. Vid jämnt antal – medel av de två i mitten.",
        "Medelvärde: 'lägg ihop allt, dela på hur många'."],
  sum:["Medelvärde = summa ÷ antal.","Median = mittvärdet (sortera först).","Typvärde = det vanligaste värdet."]},
 q:{latt:[
  {t:"in",q:"Vad är medelvärdet av 4, 6 och 8?",ans:"6",ex:"(4+6+8)/3 = 18/3 = <b>6</b>."},
  {t:"in",q:"Vad är medianen av 3, 5 och 9?",ans:"5",ex:"Mittersta talet är <b>5</b>."},
  {t:"mc",q:"Vad betyder medelvärde?",opts:["Det mittersta talet","Summan ÷ antalet","Det vanligaste talet","Det största talet"],correct:1,ex:"Medelvärde = <b>summan delat med antalet</b>."},
  {t:"in",q:"Vad är typvärdet i 2, 3, 3, 7?",ans:"3",ex:"3 förekommer flest gånger → typvärde <b>3</b>."},
  {t:"in",q:"Medelvärdet av 10 och 20?",ans:"15",ex:"(10+20)/2 = <b>15</b>."},
  {t:"tf",q:"Medianen är alltid det största talet.",correct:false,ex:"Nej – medianen är det <b>mittersta</b> talet."},
  {t:"in",q:"Median av 1, 2, 3, 4, 5?",ans:"3",ex:"Mittersta av fem tal är <b>3</b>."},
  {t:"in",q:"Medelvärdet av 5, 5 och 5?",ans:"5",ex:"(5+5+5)/3 = <b>5</b>."},
  {t:"mc",q:"Vilket är typvärdet: 4, 4, 6, 9?",opts:["4","6","9","5"],correct:0,ex:"<b>4</b> kommer oftast."},
  {t:"in",q:"Medelvärdet av 2, 4, 6, 8?",ans:"5",ex:"(2+4+6+8)/4 = 20/4 = <b>5</b>."}
 ],medel:[
  {t:"in",q:"Medelvärdet av 12, 15 och 18?",ans:"15",ex:"(12+15+18)/3 = 45/3 = <b>15</b>."},
  {t:"in",q:"Median av 7, 2, 9, 4, 5 (sortera först)?",ans:"5",ex:"Sorterat: 2,4,5,7,9 → mitten = <b>5</b>."},
  {t:"in",q:"Medelvärdet av 3, 7, 8, 2?",ans:"5",ex:"(3+7+8+2)/4 = 20/4 = <b>5</b>."},
  {t:"in",q:"Median av 4, 8, 6, 2 (jämnt antal)?",ans:"5",ex:"Sorterat: 2,4,6,8 → medel av 4 och 6 = <b>5</b>."},
  {t:"in",q:"Lolya har provresultaten 8, 10, 6. Vad är medelvärdet?",ans:"8",ex:"(8+10+6)/3 = 24/3 = <b>8</b>."},
  {t:"tf",q:"Median av 1, 3, 5, 7 är 4.",correct:true,ex:"Medel av de två mittersta (3 och 5) = <b>4</b>. ✔"},
  {t:"in",q:"Typvärde av 5, 8, 8, 8, 2?",ans:"8",ex:"<b>8</b> förekommer flest gånger."},
  {t:"in",q:"Medelvärdet av 20, 30, 40, 50?",ans:"35",ex:"(20+30+40+50)/4 = 140/4 = <b>35</b>."},
  {t:"mc",q:"Fem elever är 150, 152, 148, 155, 150 cm. Typvärde?",opts:["148","150","152","155"],correct:1,ex:"<b>150</b> cm förekommer två gånger."},
  {t:"in",q:"Median av 10, 20, 30?",ans:"20",ex:"Mitten = <b>20</b>."}
 ],svar:[
  {t:"in",q:"Medelvärdet av fyra tal är 10. Tre av talen är 8, 9 och 11. Vad är det fjärde?",ans:"12",ex:"Summan måste vara 4·10 = 40. 8+9+11 = 28. Fjärde = 40 − 28 = <b>12</b>."},
  {t:"in",q:"Lolyas prov: 12, 15, 18, x. Medelvärdet är 15. Vad är x?",ans:"15",ex:"Summan = 4·15 = 60. 12+15+18 = 45. x = 60 − 45 = <b>15</b>."},
  {t:"in",q:"Median av 3, 8, 5, 10, 7, 6 (sex tal)?",ans:"6,5",accept:A("6,5","6.5"),ex:"Sorterat: 3,5,6,7,8,10 → medel av 6 och 7 = <b>6,5</b>."},
  {t:"in",q:"Ett lag gjorde 2, 3, 3, 4 och 8 mål. Vad är medelvärdet?",ans:"4",ex:"(2+3+3+4+8)/5 = 20/5 = <b>4</b>."},
  {t:"in",q:"I föregående fråga (mål 2,3,3,4,8) – vad är medianen?",ans:"3",ex:"Sorterat: 2,3,3,4,8 → mitten = <b>3</b>."},
  {t:"in",q:"Medelvärdet av 6 tal är 5. Om ett tal (11) tas bort – vad blir medelvärdet av de 5 som är kvar?",ans:"3,8",accept:A("3,8","3.8"),ex:"Summa = 30. Utan 11 → 19. 19/5 = <b>3,8</b>."},
  {t:"in",q:"Talen 4, 6, 6, 8, x har medelvärdet 6. Vad är x?",ans:"6",ex:"Summa = 5·6 = 30. 4+6+6+8 = 24. x = <b>6</b>."},
  {t:"in",q:"Median av 100, 50, 75, 25?",ans:"62,5",accept:A("62,5","62.5"),ex:"Sorterat: 25,50,75,100 → medel av 50 och 75 = <b>62,5</b>."},
  {t:"in",q:"Fem tal har medelvärdet 20 och median 18. Om alla tal ökar med 5 – vad blir nya medelvärdet?",ans:"25",ex:"Ökar alla med 5 → medelvärdet ökar med 5 → <b>25</b>."},
  {t:"in",q:"Medelvärdet av 3, 7, 11, 15 och 19?",ans:"11",ex:"Summa = 55. 55/5 = <b>11</b>."}
 ]}},

{id:"algebra",grade:7,ic:"🔤",name:"Algebra & uttryck",sub:"Räkna med bokstäver",
 theory:{
  intro:"I <b>algebra</b> använder vi <b>variabler</b> – bokstäver som står för ett tal, t.ex. <b>x</b>. Ett <b>uttryck</b> som 3x + 2 kan vi förenkla och beräkna. <b>4x</b> betyder 4 · x. Termer med samma bokstav kan slås ihop: <b>3x + 2x = 5x</b>.",
  ex:["Förenkla: 3x + 2x = <b>5x</b> (lägg ihop termer med samma bokstav).","Beräkna 2x när x = 3 → 2 · 3 = <b>6</b>.","Förenkla: 4x + 3 + 2x = <b>6x + 3</b> (x-termer för sig, tal för sig)."],
  miss:["Slå ihop olika bokstäver: 2x + 3y ≠ 5xy.","Slå ihop x-termer med vanliga tal: 3x + 2 ≠ 5x.","Glömma att 4x betyder 4 · x."],
  tips:["🔤 Samla 'äpplen med äpplen': bara termer med <b>samma</b> bokstav slås ihop.","Sätt in värdet på x sist när du ska beräkna."],
  sum:["Variabel = bokstav för ett tal.","Slå bara ihop termer med samma bokstav.","4x = 4 · x. Beräkna genom att sätta in x."]},
 q:{latt:[
  {t:"in",q:"Förenkla: x + x",ans:"2x",accept:A("2x"),ex:"x + x = <b>2x</b>."},
  {t:"in",q:"Förenkla: 3x + 2x",ans:"5x",accept:A("5x"),ex:"3x + 2x = <b>5x</b>."},
  {t:"mc",q:"Vad är en variabel?",opts:["En bokstav som står för ett tal","Ett räknesätt","En parentes","Ett bråk"],correct:0,ex:"En variabel är <b>en bokstav som står för ett tal</b>."},
  {t:"in",q:"Beräkna 2x när x = 3.",ans:"6",ex:"2 · 3 = <b>6</b>."},
  {t:"in",q:"Förenkla: 5a − 2a",ans:"3a",accept:A("3a"),ex:"5a − 2a = <b>3a</b>."},
  {t:"in",q:"Beräkna x + 4 när x = 5.",ans:"9",ex:"5 + 4 = <b>9</b>."},
  {t:"tf",q:"4x betyder 4 gånger x.",correct:true,ex:"Ja, 4x = 4 · x. ✔"},
  {t:"in",q:"Förenkla: 2x + 3x + x",ans:"6x",accept:A("6x"),ex:"2x + 3x + x = <b>6x</b>."},
  {t:"in",q:"Beräkna 3x när x = 4.",ans:"12",ex:"3 · 4 = <b>12</b>."},
  {t:"mc",q:"Vilket av dessa är ett uttryck?",opts:["x + 5","x = 5","5 < 3","2 · 3 = 6"],correct:0,ex:"<b>x + 5</b> är ett uttryck (inget likhetstecken)."}
 ],medel:[
  {t:"in",q:"Förenkla: 4x + 3 + 2x",ans:"6x+3",accept:A("6x+3","3+6x"),ex:"x-termer: 4x + 2x = 6x. Kvar: <b>6x + 3</b>."},
  {t:"in",q:"Beräkna 2x + 1 när x = 5.",ans:"11",ex:"2 · 5 + 1 = 10 + 1 = <b>11</b>."},
  {t:"in",q:"Förenkla: 5x − x + 2",ans:"4x+2",accept:A("4x+2","2+4x"),ex:"5x − x = 4x. Kvar: <b>4x + 2</b>."},
  {t:"in",q:"Skriv ett uttryck för 'ett tal x ökat med 7'.",ans:"x+7",accept:A("x+7","7+x"),ex:"Ökat med 7 → <b>x + 7</b>."},
  {t:"in",q:"Beräkna 3(x + 2) när x = 4.",ans:"18",ex:"3 · (4 + 2) = 3 · 6 = <b>18</b>."},
  {t:"in",q:"Förenkla: 2a + 3b + a",ans:"3a+3b",accept:A("3a+3b","3b+3a"),ex:"a-termer: 2a + a = 3a. Kvar: <b>3a + 3b</b>."},
  {t:"in",q:"Beräkna 5x − 3 när x = 2.",ans:"7",ex:"5 · 2 − 3 = 10 − 3 = <b>7</b>."},
  {t:"in",q:"En påse kostar x kr. Vad kostar 4 påsar? (uttryck)",ans:"4x",accept:A("4x"),ex:"4 påsar → <b>4x</b> kr."},
  {t:"in",q:"Förenkla: 7y − 2y − y",ans:"4y",accept:A("4y"),ex:"7y − 2y − y = <b>4y</b>."},
  {t:"in",q:"Beräkna x² när x = 3.",ans:"9",ex:"3² = 3 · 3 = <b>9</b>."}
 ],svar:[
  {t:"in",q:"Förenkla: 3(x + 2) + 2x",ans:"5x+6",accept:A("5x+6","6+5x"),ex:"3(x+2) = 3x + 6. Plus 2x → <b>5x + 6</b>."},
  {t:"in",q:"Beräkna 2x + 3y när x = 4 och y = 2.",ans:"14",ex:"2 · 4 + 3 · 2 = 8 + 6 = <b>14</b>."},
  {t:"in",q:"Förenkla: 4(2x − 1)",ans:"8x-4",accept:A("8x-4"),ex:"Gånga in: 4 · 2x − 4 · 1 = <b>8x − 4</b>."},
  {t:"in",q:"Lolya är x år. Hennes bror är 3 år äldre. Uttryck för broderns ålder?",ans:"x+3",accept:A("x+3","3+x"),ex:"3 år äldre → <b>x + 3</b>."},
  {t:"in",q:"Beräkna 2(x + 3) − x när x = 5.",ans:"11",ex:"2 · (5+3) − 5 = 16 − 5 = <b>11</b>."},
  {t:"in",q:"Förenkla: 5x + 2 − 3x + 4",ans:"2x+6",accept:A("2x+6","6+2x"),ex:"x-termer: 5x − 3x = 2x. Tal: 2 + 4 = 6. → <b>2x + 6</b>."},
  {t:"in",q:"En rektangel har sidorna x och 3. Skriv ett uttryck för omkretsen.",ans:"2x+6",accept:A("2x+6","6+2x","2(x+3)"),ex:"Omkrets = 2 · (x + 3) = <b>2x + 6</b>."},
  {t:"in",q:"Beräkna 3x² när x = 2.",ans:"12",ex:"3 · 2² = 3 · 4 = <b>12</b>."},
  {t:"in",q:"Förenkla: 2(x + 4) + 3(x − 1)",ans:"5x+5",accept:A("5x+5","5+5x"),ex:"2x + 8 + 3x − 3 = <b>5x + 5</b>."},
  {t:"in",q:"Ett tal är x. Det tredubblas och minskas med 2. Uttryck?",ans:"3x-2",accept:A("3x-2"),ex:"Tredubbla → 3x, minska med 2 → <b>3x − 2</b>."}
 ]}},

{id:"skala",grade:7,ic:"🗺️",name:"Skala",sub:"Kartor och ritningar",
 theory:{
  intro:"<b>Skala</b> visar förhållandet mellan en bild/karta och verkligheten. Skala <b>1:100</b> betyder att 1 cm på ritningen är 100 cm i verkligheten. Är första talet mindre → <b>förminskning</b>. Är det större (t.ex. 2:1) → <b>förstoring</b>.",
  ex:["Skala 1:100. 3 cm på ritningen = 3 · 100 = <b>300 cm</b> i verkligheten.","Verklig längd → ritning: dela. 800 cm i skala 1:100 → 800 ÷ 100 = <b>8 cm</b>.","Skala 2:1 (förstoring): verklig 3 cm ritas som <b>6 cm</b>."],
  miss:["Gånga när man ska dela (verklighet → ritning).","Glömma att räkna om till samma enhet (cm/m).","Blanda ihop förstoring och förminskning."],
  tips:["🗺️ Ritning → verklighet: <b>gånga</b> med skaltalet. Verklighet → ritning: <b>dela</b>.","100 cm = 1 m: ha koll på enheterna."],
  sum:["Skala 1:100 → 1 cm bild = 100 cm verklighet.","Ritning → verklighet: gånga. Tvärtom: dela.","1:x = förminskning, x:1 = förstoring."]},
 q:{latt:[
  {t:"mc",q:"Skala 1:100. Hur mycket i verkligheten är 1 cm på ritningen?",opts:["100 cm","10 cm","1 cm","1000 cm"],correct:0,ex:"1 cm på ritningen = <b>100 cm</b> i verkligheten."},
  {t:"tf",q:"Skala 1:2 är en förminskning.",correct:true,ex:"Ritningen är mindre än verkligheten → <b>förminskning</b>. ✔"},
  {t:"in",q:"Skala 1:50. 2 cm på kartan = ? cm i verkligheten",ans:"100",ex:"2 · 50 = <b>100 cm</b>."},
  {t:"mc",q:"Skala 2:1 är en …",opts:["Förminskning","Förstoring","Samma storlek","Karta"],correct:1,ex:"Bilden är större än verkligheten → <b>förstoring</b>."},
  {t:"in",q:"Skala 1:100. 3 cm på ritningen = ? cm i verkligheten",ans:"300",ex:"3 · 100 = <b>300 cm</b>."},
  {t:"tf",q:"I skala 1:1 är bilden lika stor som verkligheten.",correct:true,ex:"1:1 = samma storlek. ✔"},
  {t:"in",q:"Skala 1:10. 5 cm på ritningen = ? cm i verkligheten",ans:"50",ex:"5 · 10 = <b>50 cm</b>."},
  {t:"mc",q:"Skala 1:1000 betyder att 1 cm på kartan är …",opts:["1 cm","10 cm","1000 cm","100 cm"],correct:2,ex:"1 cm = <b>1000 cm</b> i verkligheten."},
  {t:"in",q:"Skala 1:20. 4 cm på ritningen = ? cm i verkligheten",ans:"80",ex:"4 · 20 = <b>80 cm</b>."},
  {t:"in",q:"Skala 1:100. 1 cm på ritningen = ? m i verkligheten",ans:"1",ex:"1 · 100 = 100 cm = <b>1 m</b>."}
 ],medel:[
  {t:"in",q:"Skala 1:200. 3 cm på ritningen = ? cm i verkligheten",ans:"600",ex:"3 · 200 = <b>600 cm</b>."},
  {t:"in",q:"Skala 1:100. Ett hus är 8 m brett. Hur många cm blir det på ritningen?",ans:"8",ex:"8 m = 800 cm. 800 ÷ 100 = <b>8 cm</b>."},
  {t:"in",q:"Skala 1:50. Verklig längd 250 cm = ? cm på ritningen",ans:"5",ex:"250 ÷ 50 = <b>5 cm</b>."},
  {t:"in",q:"Skala 1:1000. 4 cm på kartan = ? m i verkligheten",ans:"40",ex:"4 · 1000 = 4000 cm = <b>40 m</b>."},
  {t:"mc",q:"Skala 1:2. En sak som är 6 cm ritas som …",opts:["12 cm","3 cm","6 cm","2 cm"],correct:1,ex:"6 ÷ 2 = <b>3 cm</b>."},
  {t:"in",q:"Skala 2:1 (förstoring). En verklig längd på 3 cm ritas som ? cm",ans:"6",ex:"3 · 2 = <b>6 cm</b>."},
  {t:"in",q:"Skala 1:500. 2 cm på kartan = ? m i verkligheten",ans:"10",ex:"2 · 500 = 1000 cm = <b>10 m</b>."},
  {t:"in",q:"Skala 1:100. En verklig längd på 4,5 m = ? cm på ritningen",ans:"4,5",accept:A("4,5","4.5"),ex:"4,5 m = 450 cm. 450 ÷ 100 = <b>4,5 cm</b>."},
  {t:"in",q:"En modellbil har skala 1:20. Riktiga bilen är 4 m lång. Hur lång är modellen i cm?",ans:"20",ex:"4 m = 400 cm. 400 ÷ 20 = <b>20 cm</b>."},
  {t:"in",q:"Skala 1:250. 4 cm på ritningen = ? cm i verkligheten",ans:"1000",ex:"4 · 250 = <b>1000 cm</b>."}
 ],svar:[
  {t:"in",q:"Skala 1:100. Avståndet på kartan är 6,5 cm. Verkligt avstånd i m?",ans:"6,5",accept:A("6,5","6.5"),ex:"6,5 · 100 = 650 cm = <b>6,5 m</b>."},
  {t:"in",q:"Skala 1:50000. 4 cm på kartan = ? km i verkligheten",ans:"2",ex:"4 · 50000 = 200000 cm = 2000 m = <b>2 km</b>."},
  {t:"in",q:"En ritning i skala 1:20 visar en dörr som 10 cm. Verklig höjd i m?",ans:"2",ex:"10 · 20 = 200 cm = <b>2 m</b>."},

/* ---------- STATE ---------- */
let S={grade:6,topic:null,queue:[],idx:0,correct:0,total:0,mode:"menu",exam:[],examScored:false};
const chat=document.getElementById("chat");
const panel=document.getElementById("panel");
const $=(s)=>document.querySelector(s);
const scoreEl=$("#score"),totalEl=$("#total");

/* ---------- helpers ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function botMsg(html,cls=""){
  const m=document.createElement("div");m.className="msg";
  m.innerHTML=`<div class="avatar">🦉</div><div class="bubble ${cls}">${html}</div>`;
  chat.appendChild(m);scrollDown();return m;
}
function meMsg(text){
  const m=document.createElement("div");m.className="msg me";
  m.innerHTML=`<div class="avatar">🙋‍♀️</div><div class="bubble">${esc(text)}</div>`;
  chat.appendChild(m);scrollDown();
}
function scrollDown(){requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}));}
function setPanel(html){panel.innerHTML=html;}
function norm(s){return String(s).trim().toLowerCase().replace(/\s+/g,"").replace(/\./g,",").replace(/kr|cm²|cm|m²|m|%/g,"");}
function checkIn(q,val){
  const set=[q.ans,...(q.accept||[])].map(norm);
  return set.includes(norm(val));
}

/* ---------- MENU ---------- */
function renderMenu(){
  S.mode="menu";
  const list=TOPICS.filter(t=>t.grade===S.grade);
  setPanel(`
    <div class="card">
      <div class="tabs">
        <button class="tab ${S.grade===6?'on':''}" data-g="6">Årskurs 6</button>
        <button class="tab ${S.grade===7?'on':''}" data-g="7">Årskurs 7</button>
      </div>
      <div class="topics">
        ${list.map(t=>`<button class="topic" data-t="${t.id}">
          <span class="ic">${t.ic}</span>
          <span><span class="tt">${t.name}</span><br><span class="ts">${t.sub}</span></span>
        </button>`).join("")}
      </div>
      <div style="margin-top:12px"><button class="btn coral block" id="examBtn">🎓 Gör provet (blandade uppgifter)</button></div>
    </div>`);
  panel.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;renderMenu();});
  panel.querySelectorAll(".topic").forEach(b=>b.onclick=()=>openTopic(b.dataset.t));
  $("#examBtn").onclick=startExam;
}

/* ---------- THEORY ---------- */
function openTopic(id){
  const t=TOPICS.find(x=>x.id===id);S.topic=t;
  meMsg(`Jag vill lära mig: ${t.name}`);
  const th=t.theory;
  const html=`<div class="theory">
    <h3>${t.ic} ${t.name}</h3>
    <p>${th.intro}</p>
    <h4>✏️ Exempel</h4>${th.ex.map(e=>`<div class="ex">${e}</div>`).join("")}
    <h4>⚠️ Vanliga misstag</h4><ul>${th.miss.map(m=>`<li>${m}</li>`).join("")}</ul>
    <h4>💡 Tips & minnesregler</h4><ul>${th.tips.map(m=>`<li>${m}</li>`).join("")}</ul>
    <h4>📌 Sammanfattning</h4><div class="summary"><ul>${th.sum.map(m=>`<li>${m}</li>`).join("")}</ul></div>
  </div>`;
  botMsg(html);
  botMsg(`Nu kör vi quizen, ${NAME}! 💪 <b>30 frågor</b> – 10 lätta, 10 medel och 10 svåra. Jag rättar varje svar direkt.`);
  setPanel(`<div class="card">
    <button class="btn primary block" id="startQ">🚀 Starta quizen</button>
    <div class="actions" style="margin-top:10px"><button class="btn ghost" id="back">← Välj annat ämne</button></div>
  </div>`);
  $("#startQ").onclick=startQuiz;
  $("#back").onclick=()=>{renderMenu();};
}

/* ---------- QUIZ ---------- */
function startQuiz(){
  const t=S.topic;
  S.queue=[
    ...t.q.latt.map(q=>({...q,lvl:"latt"})),
    ...t.q.medel.map(q=>({...q,lvl:"medel"})),
    ...t.q.svar.map(q=>({...q,lvl:"svar"}))
  ];
  S.idx=0;S.correct=0;S.mode="quiz";
  botMsg(`Lycka till! ⭐ Svara i lugn och ro.`);
  showQuestion();
}
const LVL={latt:"Lätt",medel:"Medel",svar:"Svår"};
function showQuestion(){
  if(S.idx>=S.queue.length)return quizDone();
  const q=S.queue[S.idx];
  const prog=Math.round((S.idx/S.queue.length)*100);
  let body="";
  if(q.t==="mc"){
    body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lt">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>`;
  }else if(q.t==="tf"){
    body=`<div class="tfrow"><button class="btn" data-v="true">✔ Sant</button><button class="btn" data-v="false">✘ Falskt</button></div>`;
  }else{
    body=`<form class="inrow" id="inform"><input id="inbox" autocomplete="off" placeholder="Ditt svar…" inputmode="text"><button class="btn primary" type="submit">Svara</button></form>`;
  }
  setPanel(`<div class="card">
    <div class="qhead"><span class="level ${q.lvl}">${LVL[q.lvl]}</span><span style="color:var(--muted);font-weight:700;font-size:.85rem">Fråga ${S.idx+1} / ${S.queue.length}</span></div>
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="qtext">${q.q}</div>
    ${body}
  </div>`);
  if(q.t==="mc")panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQuiz(q,+b.dataset.i,q.opts[b.dataset.i]));
  else if(q.t==="tf")panel.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>answerQuiz(q,b.dataset.v==="true",b.dataset.v==="true"?"Sant":"Falskt"));
  else{const f=$("#inform");f.onsubmit=(e)=>{e.preventDefault();const v=$("#inbox").value.trim();if(!v)return;answerQuiz(q,v,v);};$("#inbox").focus();}
}
function answerQuiz(q,val,label){
  let ok;
  if(q.t==="mc")ok=(val===q.correct);
  else if(q.t==="tf")ok=(val===q.correct);
  else ok=checkIn(q,val);
  meMsg(label);
  S.total++;
  if(ok){
    S.correct++;
    const praise=["Helt rätt!","Snyggt jobbat!","Precis rätt, "+NAME+"!","Toppen! ⭐","Perfekt!","Ja! Du fixade det!"];
    botMsg(`<span class="tag g">Rätt</span><br><b>${praise[S.total%praise.length]}</b><br>${q.ex}`,"good");
    burst();
  }else{
    let correctTxt;
    if(q.t==="mc")correctTxt=`${"ABCD"[q.correct]}: ${q.opts[q.correct]}`;
    else if(q.t==="tf")correctTxt=q.correct?"Sant":"Falskt";
    else correctTxt=q.ans;
    botMsg(`<span class="tag b">Inte riktigt</span><br>Rätt svar är <b>${correctTxt}</b>.
      <div class="steps"><span class="k">Så här löser du det</span><br>${q.ex}</div>
      <div class="mini">Ta det lugnt – nu vet du hur nästa liknande går. 💛</div>`,"bad");
  }
  scoreEl.textContent=S.correct+ (S.mode==="quiz"? 0:0);
  updateScoreDisplay();
  S.idx++;
  setPanel(`<div class="card"><button class="btn primary block" id="next">${S.idx>=S.queue.length?"Se resultat 🏁":"Nästa fråga →"}</button></div>`);
  $("#next").onclick=showQuestion;
}
function updateScoreDisplay(){scoreEl.textContent=S.correct;totalEl.textContent=S.total;}
function quizDone(){
  S.mode="menu";
  const n=S.queue.length,c=S.correct;
  const pct=Math.round(c/n*100);
  let msg,emoji;
  if(pct>=90){msg="Fantastiskt jobbat!";emoji="🏆";}
  else if(pct>=70){msg="Riktigt bra gjort!";emoji="🌟";}
  else if(pct>=50){msg="Bra kämpat – du är på väg!";emoji="💪";}
  else{msg="Bra att du tränar – öva lite till så lossnar det!";emoji="🌱";}
  botMsg(`<div class="gradebox"><div style="font-size:2.4rem">${emoji}</div>
    <div class="grade">${c} / ${n}</div>
    <div style="color:var(--muted);font-weight:700">${pct}% rätt</div></div>
    <p style="text-align:center;margin-top:6px"><b>${msg}</b></p>`);
  setPanel(`<div class="card">
    <button class="btn primary block" id="again">🔁 Gör om samma quiz</button>
    <div class="actions" style="margin-top:10px">
      <button class="btn ghost" id="menu">📚 Nytt ämne</button>
      <button class="btn coral" id="exam">🎓 Gör provet</button>
    </div></div>`);
  $("#again").onclick=()=>{botMsg("Vi kör igen! 💪");startQuiz();};
  $("#menu").onclick=renderMenu;
  $("#exam").onclick=startExam;
}

/* ---------- EXAM ---------- */
function startExam(){
  meMsg("Jag är redo för provet!");
  botMsg(`<b>🎓 Matteprov – åk 6/7</b><br>${EXAM.length} uppgifter, totalt <b>${EXAM_MAX} poäng</b>. Blandade områden.
    <div class="mini">Här får du <b>ingen</b> rättning under provets gång – precis som ett riktigt prov. Rättning och betyg kommer på slutet. Lycka till, ${NAME}! ✨</div>`);
  S.exam=EXAM.map(q=>({...q,given:null,ok:false}));
  S.idx=0;S.mode="exam";
  showExam();
}
function showExam(){
  if(S.idx>=S.exam.length)return examResult();
  const q=S.exam[S.idx];
  const prog=Math.round((S.idx/S.exam.length)*100);
  let body="";
  if(q.t==="mc")body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lt">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>`;
  else body=`<form class="inrow" id="exform"><input id="exbox" autocomplete="off" placeholder="Ditt svar…"><button class="btn primary" type="submit">Nästa →</button></form>`;
  setPanel(`<div class="card">
    <div class="qhead"><span class="level medel">Prov · ${q.p} p</span><span style="color:var(--muted);font-weight:700;font-size:.85rem">Uppgift ${S.idx+1} / ${S.exam.length}</span></div>
    <div class="progress"><i style="width:${prog}%"></i></div>
    <div class="qtext">${q.q}</div>${body}</div>`);
  if(q.t==="mc")panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>recExam(q,+b.dataset.i,q.opts[b.dataset.i]));
  else{const f=$("#exform");f.onsubmit=(e)=>{e.preventDefault();const v=$("#exbox").value.trim();if(!v)return;recExam(q,v,v);};$("#exbox").focus();}
}
function recExam(q,val,label){
  meMsg(label);
  q.given=label;
  q.ok=(q.t==="mc")?(val===q.correct):checkIn(q,val);
  botMsg(`Svar sparat ✅`);
  S.idx++;
  showExam();
}
function examResult(){
  S.mode="menu";
  let pts=0;
  const rows=S.exam.map((q,i)=>{
    if(q.ok)pts+=q.p;
    let corr;
    if(q.t==="mc")corr=q.opts[q.correct];else corr=q.ans;
    return `<div class="steps" style="border-color:${q.ok?'var(--good)':'var(--bad)'};margin:8px 0">
      <span class="k">${q.ok?'✔ Rätt':'✘ Fel'} · Uppgift ${i+1} (${q.p} p)</span><br>
      <span style="font-size:.9rem">${q.q}</span><br>
      Ditt svar: <b>${esc(String(q.given))}</b>${q.ok?"":` · Rätt: <b>${corr}</b>`}
      ${q.ok?"":`<div class="mini">${q.ex}</div>`}
    </div>`;
  }).join("");
  const pct=Math.round(pts/EXAM_MAX*100);
  let betyg,col;
  if(pct>=85){betyg="A";col="var(--good)";}
  else if(pct>=70){betyg="C";col="var(--teal)";}
  else if(pct>=50){betyg="E";col="var(--gold)";}
  else{betyg="Öva mer";col="var(--coral)";}
  botMsg(`<div class="gradebox">
    <div style="font-size:.8rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em">Ditt provbetyg</div>
    <div class="grade" style="color:${col}">${betyg}</div>
    <div style="font-weight:800;font-size:1.2rem">${pts} / ${EXAM_MAX} poäng</div>
    <div style="color:var(--muted);font-weight:700">${pct}%</div></div>
    <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
    <p style="text-align:center"><b>${pct>=50?`Snyggt jobbat, ${NAME}! 🎉`:`Bra kämpat, ${NAME}! Träna på det röda så växer du. 🌱`}</b></p>
    <h4 style="margin-top:12px;color:var(--teal);font-size:.82rem;text-transform:uppercase;letter-spacing:.05em">📋 Full rättning</h4>
    ${rows}`);
  if(pct>=50)burst();
  setPanel(`<div class="card">
    <button class="btn primary block" id="retry">🔁 Gör provet igen</button>
    <div class="actions" style="margin-top:10px"><button class="btn ghost" id="menu2">📚 Tillbaka till ämnen</button></div></div>`);
  $("#retry").onclick=startExam;
  $("#menu2").onclick=renderMenu;
}

/* ---------- confetti ---------- */
const cvs=$("#cfx");let cx,parts=[],raf=null;
function burst(){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  cvs.classList.remove("hidden");
  cvs.width=innerWidth;cvs.height=innerHeight;cx=cvs.getContext("2d");
  const cols=["#0E9C93","#FF7A59","#F0B429","#7B61FF","#1CA36B"];
  for(let i=0;i<70;i++)parts.push({x:innerWidth/2,y:innerHeight*0.4,vx:(Math.cos(i)*6),vy:-(4+ (i%7)),g:0.22,c:cols[i%cols.length],s:5+i%5,life:60+i%30,a:1});
  if(!raf)tick();
}
function tick(){
  cx.clearRect(0,0,cvs.width,cvs.height);let alive=false;
  parts.forEach(p=>{if(p.life<=0)return;alive=true;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;p.a=Math.max(0,p.life/60);
    cx.globalAlpha=p.a;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*1.4);});
  cx.globalAlpha=1;
  if(alive)raf=requestAnimationFrame(tick);else{parts=[];raf=null;cvs.classList.add("hidden");}
}

/* ---------- theme ---------- */
const tb=$("#themebtn");
function curTheme(){return document.documentElement.getAttribute("data-theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");}
tb.onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);tb.textContent=n==="dark"?"☀️":"🌙";};
tb.textContent=curTheme()==="dark"?"☀️":"🌙";

function intro(){
  botMsg(`Hej <b>${NAME}</b>! 👋 Jag är <b>Fröken Uggla</b>, din mattekompis. 🦉`);
  botMsg(`Vi ska träna matte för <b>åk 6 och 7</b> tillsammans. För varje ämne får du <b>teori med exempel</b>, sedan en <b>quiz</b> med 30 frågor (lätt → svår), och till sist kan du göra ett riktigt <b>prov med betyg</b>. 🎯`);
  botMsg(`Välj din <b>årskurs</b> och ett <b>ämne</b> nedan, så sätter vi igång! 👇`);
  renderMenu();
}
intro();
